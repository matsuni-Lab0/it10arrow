<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ITパスポート アローダイアグラム練習 v2.3</title><style>
:root{font-family:system-ui,'Noto Sans JP',sans-serif;color:#203047;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1020px;margin:auto;padding:16px}header{background:#193963;color:white;border-radius:15px;padding:18px 22px}h1{font-size:clamp(20px,3.6vw,28px);margin:0 0 6px}h2{font-size:19px;margin:0 0 12px}.small{font-size:13px;color:#64748b}.sub{font-size:13px;color:#e3ecff}.tabs,.row{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.tabs{margin:14px 0}button,select,input{font:inherit}button{border:1px solid #b9c8da;background:white;color:#204269;border-radius:9px;padding:9px 13px;cursor:pointer;min-height:42px;font-weight:650}button.active,button.primary{background:#2458a4;color:white;border-color:#2458a4}button:disabled{opacity:.55;cursor:default}.panel{background:white;border:1px solid #dbe3ee;border-radius:14px;padding:17px;margin-bottom:14px}.control{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.control label{display:flex;gap:5px;align-items:center;flex-wrap:wrap}select{padding:8px;border:1px solid #c5d1df;border-radius:7px;background:white}.graph{width:100%;height:auto;display:block;max-height:440px;background:#fff}.line{stroke:#7488a3;stroke-width:3;fill:none;stroke-linecap:round}.line.hit{stroke:transparent;stroke-width:20;pointer-events:stroke;cursor:pointer}.line.chosen{stroke:#ed8b24;stroke-width:5}.line.critical{stroke:#d33c53;stroke-width:5}.node{fill:#2758a8;stroke:white;stroke-width:2}.worklabel{font-size:15px;font-weight:750;fill:#203047;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round;pointer-events:none}.pick{background:#fff5e7;border-color:#ed8b24}.question{font-size:17px;font-weight:750;margin:16px 0 12px}.field{padding:10px;border:1px solid #b7c6d7;border-radius:8px;width:125px}.hidden{display:none!important}.notice{padding:12px;border-radius:8px;background:#edf5ff;margin-top:12px;line-height:1.7}.bad{background:#fff0ed}.stage{padding:10px;margin:8px 0;background:#f4f7fb;border-radius:8px}.stage label{display:block;font-weight:650;margin-bottom:7px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{text-align:center;background:#f2f6fc;padding:12px;border-radius:9px}.stat strong{display:block;font-size:23px}.muted{color:#64748b;font-size:13px}.actions{margin-top:12px}.note{line-height:1.8}svg g[role=button]:focus-visible .line:not(.hit){stroke:#f59e0b;stroke-width:5}@media(max-width:600px){.wrap{padding:8px}.panel{padding:11px}.worklabel{font-size:14px}.control{gap:8px}}
</style></head><body><div class="wrap"><header><h1>アローダイアグラム 練習ツール v2.3</h1><div class="sub">ITパスポート試験対策／基本的な直線型ネットワークに再設計</div></header><nav class="tabs"><button id="studyTab" class="active">学習モード</button><button id="examTab">試験モード</button><button id="historyTab">学習履歴</button></nav><section id="work"><div class="panel"><div class="control"><label>問題形式 <select id="kind"><option value="basic">基本・経路</option><option value="delay">遅延問題</option><option value="shorten">短縮問題</option><option value="staff">要員計算</option><option value="mixed">応用ランダム</option></select></label><label>難易度 <select id="level"><option value="0">初級</option><option value="1">中級</option><option value="2">上級</option></select></label><label>図の形 <select id="shape"><option value="auto">自動切替</option><option value="0">基本分岐型</option><option value="1">合流型</option><option value="2">二段階分岐型</option><option value="3">複合型</option></select></label><button id="newQ">新しい問題</button></div><p class="small" id="guide">作業をクリックしてクリティカルパスを選択してください。</p><svg id="graph" class="graph" viewBox="0 0 760 350" role="img" aria-label="作業ネットワーク図"></svg><div id="selection" class="small">選択中：なし</div><div id="workButtons" class="row actions"></div><div id="question" class="question"></div><div id="basicBox"><label>全体の最短完了日数 <input type="number" min="0" step="1" inputmode="numeric" id="days" class="field" placeholder="日数"> 日</label></div><div id="stageBox"></div><div class="row actions"><button id="check" class="primary">解答する</button><button id="clear">選択を解除</button><button id="hintBtn">ヒントを見る</button><button id="explainBtn">解説を見る</button></div><div id="hint" class="notice hidden"></div><div id="feedback" class="notice hidden"></div><div id="explanation" class="notice hidden"></div></div><div class="panel note"><h2>図の読み方</h2>青い丸は結合点、矢印は作業を表します。各作業は必ず独立した矢印で示します。図の途中で作業が分かれたり合流したりする場合も、矢印を重ねずに表示します。</div></section><section id="history" class="hidden"><div class="panel"><h2>学習履歴</h2><div class="stats"><div class="stat">解答数<strong id="total">0</strong></div><div class="stat">正答数<strong id="correct">0</strong></div><div class="stat">正答率<strong id="rate">0%</strong></div></div><div id="records" class="note"></div><div class="row"><button id="export">CSV保存</button><button id="reset">履歴を削除</button></div></div></section><p class="muted">単一HTML／オフライン対応／学習履歴はブラウザ内に保存</p></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),KEY='arrow_practice_v23_history',NS='http://www.w3.org/2000/svg';let mode='study',problem=null,selected=new Set(),answered=false,revealed=false;
// 作業ごとに独立した辺を持つDAG。全辺は異なる直線区間、全ノードは左から右へ配置する。
const shapes=[
 {name:'基本分岐型',pos:[[65,175],[305,70],[305,280],[690,175]],arcs:[[0,1],[0,2],[1,3],[2,3]]},
 {name:'合流型',pos:[[65,175],[270,65],[270,285],[475,175],[690,175]],arcs:[[0,1],[0,2],[1,3],[2,3],[3,4]]},
 {name:'二段階分岐型',pos:[[65,175],[240,70],[240,280],[475,70],[475,280],[690,175]],arcs:[[0,1],[0,2],[1,3],[1,4],[2,4],[3,5],[4,5]]},
 {name:'複合型',pos:[[65,175],[225,65],[225,285],[440,65],[440,175],[440,285],[690,175]],arcs:[[0,1],[0,2],[1,3],[1,4],[2,4],[2,5],[3,6],[4,6],[5,6]]}
];const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,letter=i=>String.fromCharCode(65+i);
function solve(p){let n=p.pos.length,early=Array(n).fill(0),late=Array(n).fill(Infinity);for(let i=1;i<n;i++)for(const e of p.edges.filter(e=>e.b===i))early[i]=Math.max(early[i],early[e.a]+e.d);late[n-1]=early[n-1];for(let i=n-2;i>=0;i--)for(const e of p.edges.filter(e=>e.a===i))late[i]=Math.min(late[i],late[e.b]-e.d);const critical=p.edges.filter(e=>early[e.a]===late[e.a]&&early[e.b]===late[e.b]&&early[e.a]+e.d===early[e.b]).map(e=>e.id);return {early,late,critical,duration:early[n-1]}}
function setup(){let kind=$('kind').value;if(kind==='mixed')kind=['delay','shorten','staff'][rand(0,2)];let shape=$('shape').value,level=+$('level').value;let idx=shape==='auto'?(kind==='basic'?(level===0?rand(0,1):level===1?rand(1,2):rand(2,3)):rand(0,3)):+shape;const template=shapes[idx],edges=template.arcs.map(([a,b],id)=>({a,b,id,d:rand(2,level===0?8:12)}));let p={...template,edges,kind};let result=solve(p);Object.assign(p,result);
// 応用問題は任意のクリティカル作業を遅延させ、その影響をネットワーク計算で検証する。
if(kind!=='basic'){
 const choices=p.edges.filter(e=>p.critical.includes(e.id)&&e.b!==p.pos.length-1);const target=choices.length?choices[rand(0,choices.length-1)]:p.edges.find(e=>p.critical.includes(e.id));const delay=rand(2,4),afterEdges=p.edges.map(e=>({...e,d:e.d+(e.id===target.id?delay:0)}));const after=solve({...p,edges:afterEdges});
 // 短縮は遅延させた同一作業を戻すことを問う。最小短縮量は二分探索ではなく全候補を再計算。
 let minShort=0;for(let k=0;k<=delay;k++){let ee=afterEdges.map(e=>({...e,d:e.d-(e.id===target.id?k:0)}));if(solve({...p,edges:ee}).duration<=p.duration){minShort=k;break}}
 const originalDays=target.d,staff=rand(2,5),work=staff*originalDays;
 // 人数の計算は、必要人数が整数になるよう追加作業量（人日）を問題文で明示。
 const neededDays=Math.max(1,originalDays-minShort),required=Math.ceil(work/neededDays),added=Math.max(0,required-staff);
 p.applied={target,delay,after,afterEdges,minShort,staff,work,neededDays,required,added};
}problem=p;selected.clear();answered=false;revealed=false;$('days').value='';$('check').disabled=false;for(const id of ['hint','feedback','explanation'])$(id).classList.add('hidden');$('basicBox').classList.toggle('hidden',kind!=='basic');$('stageBox').replaceChildren();$('workButtons').classList.toggle('hidden',kind!=='basic');$('selection').classList.toggle('hidden',kind!=='basic');$('clear').classList.toggle('hidden',kind!=='basic');
if(kind==='basic'){$('question').textContent='問：全作業が完了するまでの最短日数と、クリティカルパス上の作業を答えてください。';}
else{const a=p.applied,workName=letter(a.target.id);if(kind==='delay'){$('question').textContent=`問：作業${workName}が${a.delay}日遅れたとき、全作業の完了日数は何日になりますか。`;addStage('after','遅延後の完了日数（日）');}else if(kind==='shorten'){$('question').textContent=`問：作業${workName}が${a.delay}日遅れました。元の全体完了予定日数を守るため、遅延した作業${workName}の所要日数を最低何日短縮する必要がありますか。`;addStage('short','必要な短縮日数（日）');}else{$('question').textContent=`問：作業${workName}が${a.delay}日遅れました。元の完了予定日数を守るため、作業${workName}を短縮します。もとの作業には${a.staff}人を配置し、作業量は${a.work}人日で一定とします。必要な追加要員数は最少何人ですか（1日当たりの作業量は各人同じ）。`;addStage('add','追加要員数（人）');}}
render()}
function addStage(id,label){let div=document.createElement('div');div.className='stage';let l=document.createElement('label');l.htmlFor='step-'+id;l.textContent=label;let inp=document.createElement('input');inp.type='number';inp.step='1';inp.min='0';inp.inputMode='numeric';inp.id='step-'+id;inp.className='field';div.append(l,inp);$('stageBox').append(div)}
function svg(tag,attrs,parent){const el=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,v);parent.append(el);return el}
function render(){const root=$('graph');root.replaceChildren();const defs=svg('defs',{},root);for(const [key,color] of [['normal','#7488a3'],['chosen','#ed8b24'],['critical','#d33c53']]){const m=svg('marker',{id:'arr-'+key,markerWidth:8,markerHeight:8,refX:7,refY:3,orient:'auto',markerUnits:'userSpaceOnUse'},defs);svg('path',{d:'M0 0 L7 3 L0 6 Z',fill:color},m)}const edgeLayer=svg('g',{},root),nodeLayer=svg('g',{},root),labelLayer=svg('g',{},root);const labelRects=[];
// 各矢印の端点をノードの円周まで短縮し、作業名は別レイヤーに配置。
for(const e of problem.edges){let [x1,y1]=problem.pos[e.a],[x2,y2]=problem.pos[e.b],dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),ux=dx/len,uy=dy/len;const xStart=x1+ux*25,yStart=y1+uy*25,xEnd=x2-ux*26,yEnd=y2-uy*26;const state=revealed&&problem.critical.includes(e.id)?'critical':selected.has(e.id)?'chosen':'normal';const g=svg('g',{role:'button',tabindex:'0','aria-label':`作業${letter(e.id)} ${e.d}日`},edgeLayer);const common={x1:xStart,y1:yStart,x2:xEnd,y2:yEnd};svg('line',{...common,class:'line hit'},g);svg('line',{...common,class:'line '+(state==='normal'?'':state),'marker-end':'url(#arr-'+state+')'},g);const toggle=()=>{if(answered||revealed||problem.kind!=='basic')return;selected.has(e.id)?selected.delete(e.id):selected.add(e.id);render()};g.addEventListener('click',toggle);g.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();toggle()}});
 // ラベルを矢印の垂線方向へ移し、ノード・既配置ラベルとの交差を数値評価。
 const label=letter(e.id)+'：'+e.d+'日',w=label.length*15+10,h=24,nx=-uy,ny=ux;let best=null;for(const t of [.5,.38,.62,.28,.72])for(const distance of [-23,23,-35,35,-48,48]){let x=x1+dx*t+nx*distance,y=y1+dy*t+ny*distance;const rect={left:x-w/2,right:x+w/2,top:y-17,bottom:y+7};let score=Math.abs(distance)*.2+Math.abs(t-.5)*20;if(rect.left<12||rect.right>748||rect.top<15||rect.bottom>335)score+=5000;for(const [cx,cy] of problem.pos){const nearX=Math.max(rect.left,Math.min(cx,rect.right)),nearY=Math.max(rect.top,Math.min(cy,rect.bottom));if(Math.hypot(cx-nearX,cy-nearY)<27)score+=10000}for(const r of labelRects){score+=Math.max(0,Math.min(rect.right,r.right)-Math.max(rect.left,r.left))*Math.max(0,Math.min(rect.bottom,r.bottom)-Math.max(rect.top,r.top))*15}if(!best||score<best.score)best={x,y,rect,score}}labelRects.push(best.rect);const txt=svg('text',{x:best.x,y:best.y,'text-anchor':'middle',class:'worklabel'},labelLayer);txt.textContent=label;}
problem.pos.forEach(([x,y])=>svg('circle',{cx:x,cy:y,r:24,class:'node'},nodeLayer));$('selection').textContent='選択中：'+(selected.size?[...selected].sort((a,b)=>a-b).map(letter).join('・'):'なし');const buttons=$('workButtons');buttons.replaceChildren();for(const e of problem.edges){const b=document.createElement('button');b.textContent='作業 '+letter(e.id)+(selected.has(e.id)?' ?':'');b.classList.toggle('pick',selected.has(e.id));b.disabled=answered||revealed;b.onclick=()=>{selected.has(e.id)?selected.delete(e.id):selected.add(e.id);render()};buttons.append(b)}}
function explain(){revealed=true;render();const p=problem,a=p.applied;let text=`<strong>計算の考え方</strong><ol><li>始点を0日として、各結合点の最早時刻を計算します。合流点では最大値を採用します。</li><li>当初の最短完了日数は <strong>${p.duration}日</strong>です。</li><li>クリティカル作業：<strong>${p.critical.map(letter).join('・')}</strong>。赤い矢印で示しています。</li>`;if(a){text+=`<li>作業${letter(a.target.id)}が${a.delay}日遅れた場合の全体完了日数は <strong>${a.after.duration}日</strong>です。</li><li>元の予定に戻すには、遅延した作業を <strong>${a.minShort}日</strong>短縮します。</li>`;if(p.kind==='staff')text+=`<li>必要な作業日数は${a.neededDays}日、必要総人数は ${a.work}÷${a.neededDays} を切り上げて <strong>${a.required}人</strong>、追加要員数は <strong>${a.added}人</strong>です。</li>`}text+='</ol><small>この図の矢印はすべて独立した作業を表し、同じ区間に複数作業を重ねていません。</small>';$('explanation').innerHTML=text;$('explanation').classList.remove('hidden')}
function check(){if(answered)return;const p=problem,a=p.applied;let value,expected,ok,detail;if(p.kind==='basic'){if($('days').value===''){alert('完了日数を入力してください。');return}value=Number($('days').value);expected=p.duration;const pathOK=selected.size===p.critical.length&&p.critical.every(x=>selected.has(x));ok=value===expected&&pathOK;detail=`日数：${value===expected?'○':'×'} ／ クリティカルパス：${pathOK?'○':'×'}`}else{const id=p.kind==='delay'?'after':p.kind==='shorten'?'short':'add';const input=$('step-'+id);if(input.value===''){alert('解答を入力してください。');return}value=Number(input.value);expected=p.kind==='delay'?a.after.duration:p.kind==='shorten'?a.minShort:a.added;ok=value===expected;detail=`入力：${value} ／ 正解：${expected}`}answered=true;$('check').disabled=true;$('feedback').classList.remove('hidden');$('feedback').classList.toggle('bad',!ok);$('feedback').textContent=(ok?'正解です！ ':'不正解です。 ')+detail;const data=read();data.unshift({date:new Date().toLocaleString('ja-JP'),mode,kind:p.kind,shape:p.name,value,expected,ok});write(data.slice(0,500));if(mode==='exam'||!ok)explain();else render()}
function read(){try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(a)?a:[]}catch{return[]}}function write(a){try{localStorage.setItem(KEY,JSON.stringify(a))}catch{alert('履歴を保存できませんでした')}}function showHistory(){let a=read(),c=a.filter(x=>x.ok).length;$('total').textContent=a.length;$('correct').textContent=c;$('rate').textContent=a.length?Math.round(c/a.length*100)+'%':'0%';$('records').replaceChildren();for(const x of a.slice(0,30)){const p=document.createElement('p');p.textContent=`${x.date}｜${x.mode==='study'?'学習':'試験'}｜${x.kind}｜${x.shape}｜${x.ok?'○':'×'}｜入力 ${x.value} / 正解 ${x.expected}`;$('records').append(p)}}function switchMode(m){mode=m;for(const x of ['study','exam','history'])$(x+'Tab').classList.toggle('active',m===x);$('work').classList.toggle('hidden',m==='history');$('history').classList.toggle('hidden',m!=='history');if(m==='history'){showHistory();return}$('hintBtn').classList.toggle('hidden',m==='exam');$('explainBtn').classList.toggle('hidden',m==='exam');$('guide').textContent=m==='study'?'矢印または作業ボタンを選択。ヒント・解説を確認できます。':'ヒントなしで解答し、採点後に解説を確認します。';setup()}
$('studyTab').onclick=()=>switchMode('study');$('examTab').onclick=()=>switchMode('exam');$('historyTab').onclick=()=>switchMode('history');for(const id of ['kind','level','shape'])$(id).onchange=setup;$('newQ').onclick=setup;$('check').onclick=check;$('clear').onclick=()=>{if(!answered&&!revealed){selected.clear();render()}};$('hintBtn').onclick=()=>{$('hint').textContent=problem.kind==='basic'?'合流点では到着時刻の最大値を選びます。':'遅延した作業の時間を加算して、全体の最早完了時刻を計算し直します。';$('hint').classList.remove('hidden')};$('explainBtn').onclick=explain;$('reset').onclick=()=>{if(confirm('学習履歴を削除しますか？')){write([]);showHistory()}};$('export').onclick=()=>{let a=read();if(!a.length){alert('履歴がありません');return}const esc=x=>'"'+String(x).replaceAll('"','""')+'"';const csv='\ufeff'+[['日時','モード','形式','図','入力','正解','正誤'],...a.map(x=>[x.date,x.mode,x.kind,x.shape,x.value,x.expected,x.ok?'正解':'不正解'])].map(r=>r.map(esc).join(',')).join('\r\n');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const link=document.createElement('a');link.href=u;link.download='arrow_history_v2_3.csv';link.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};setup()})();
</script></body></html>
